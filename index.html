<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenBeat.js - Concert Mode</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        transition: background-color 0.05s ease-out;
        overflow: hidden;
      }

      .bright {
        background-color: white;
      }

      h2 {
        margin-bottom: 20px;
        mix-blend-mode: difference;
      }

      button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 25px;
        border: none;
        background-color: #007bff;
        color: white;
        transition: background 0.3s;
        mix-blend-mode: difference;
      }

      button:hover {
        background-color: #0056b3;
      }

      #statusText {
        margin-top: 15px;
        mix-blend-mode: difference;
        color: #ccc;
      }

      /* --- UI Pengatur Sensitivitas Suara --- */
      .control-container {
        margin-top: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 80%;
        max-width: 400px;
        mix-blend-mode: difference; /* Menjaga elemen tetap terlihat saat layar berkedip */
      }

      .control-container label {
        font-size: 16px;
        color: #ccc;
        margin-bottom: 15px;
      }

      .control-group {
        display: flex;
        align-items: center;
        width: 100%;
        justify-content: center;
        gap: 15px;
      }

      #sensitivitySlider {
        flex-grow: 1;
        cursor: pointer;
      }

      #sensitivityNumber {
        width: 65px;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #555;
        border-radius: 6px;
        background-color: #222;
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h2>ScreenBeat.js</h2>
    <button id="actionBtn">Start Concert Mode</button>
    <p id="statusText">Click start and allow microphone access.</p>

    <!-- Kontrol Sensitivitas UI -->
    <div class="control-container">
      <label for="sensitivitySlider">Sound Sensitivity (0 - 255)</label>
      <div class="control-group">
        <input
          type="range"
          id="sensitivitySlider"
          min="0"
          max="255"
          value="190"
        />
        <input
          type="number"
          id="sensitivityNumber"
          min="0"
          max="255"
          value="190"
        />
      </div>
    </div>

    <script>
      const actionBtn = document.getElementById("actionBtn");
      const statusText = document.getElementById("statusText");
      const sensitivitySlider = document.getElementById("sensitivitySlider");
      const sensitivityNumber = document.getElementById("sensitivityNumber");
      const body = document.body;

      let audioContext;
      let analyser;
      let microphone;
      let javascriptNode;
      let isRunning = false;

      // Mengambil nilai sensitivitas awal dari elemen UI
      let sensitivity = parseInt(sensitivitySlider.value);

      // Fungsi memperbarui nilai sensitivitas dan menyinkronkan kedua kontrol
      function updateSensitivity() {
        sensitivity = parseInt(this.value);
        sensitivitySlider.value = this.value;
        sensitivityNumber.value = this.value;
      }

      sensitivitySlider.addEventListener("input", updateSensitivity);
      sensitivityNumber.addEventListener("input", updateSensitivity);

      actionBtn.addEventListener("click", function () {
        if (isRunning) {
          stopConcertMode();
        } else {
          startConcertMode();
        }
      });

      async function startConcertMode() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });

          statusText.innerText = "Listening... Play some music!";
          actionBtn.innerText = "Stop";
          isRunning = true;

          audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();
          analyser = audioContext.createAnalyser();
          microphone = audioContext.createMediaStreamSource(stream);
          javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

          analyser.smoothingTimeConstant = 0.3;
          analyser.fftSize = 256;

          microphone.connect(analyser);
          analyser.connect(javascriptNode);
          javascriptNode.connect(audioContext.destination);

          javascriptNode.onaudioprocess = function () {
            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);

            let totalVolume = 0;
            for (let i = 0; i < 10; i++) {
              totalVolume += array[i];
            }
            let averageVolume = totalVolume / 10;

            // Menggunakan variabel sensitivitas dinamis dari UI
            if (averageVolume > sensitivity) {
              body.classList.add("bright");
            } else {
              body.classList.remove("bright");
            }
          };
        } catch (err) {
          statusText.innerText = "Error: Allow mic access and use HTTPS.";
          console.error(err);
          stopConcertMode();
        }
      }

      function stopConcertMode() {
        isRunning = false;
        actionBtn.innerText = "Start Concert Mode";
        statusText.innerText = "Click start and allow microphone access.";
        body.classList.remove("bright");

        if (javascriptNode) javascriptNode.onaudioprocess = null;
        if (microphone) microphone.disconnect();
        if (analyser) analyser.disconnect();
        if (javascriptNode) javascriptNode.disconnect();
        if (audioContext) audioContext.close();
      }
    </script>
  </body>
</html>
